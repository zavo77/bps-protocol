[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# OpenZeppelin is installed via npm (see packages/contracts/package.json) and hoisted to the
# monorepo root node_modules. The remapping resolves imports from a clean `npm install`.
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../../node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
