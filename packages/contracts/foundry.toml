[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# OpenZeppelin is installed via npm (see packages/contracts/package.json) and hoisted to the
# monorepo root node_modules. The remapping resolves imports from a clean `npm install`.
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../../node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Scoped write access so the operator deployment preflight (DeployBPS.s.sol) can emit its sanitized
# manifest under ./deploy only, and so the TASK 10F-1 fork-only lifecycle rehearsal test can emit its
# raw evidence JSON under ./rehearsal-evidence only. No broadcast, no key material is ever written.
fs_permissions = [
    {access = "read-write", path = "./deploy"},
    {access = "read-write", path = "./rehearsal-evidence"},
]

# KL-1 (TASK 10K-10): narrow, reproducible build profile for the PRIVATE-CANARY deployment bytecode only.
# Robinhood Chain is an Arbitrum Dedicated Blockchain (Nitro/Orbit) L2, "fully EVM-compatible" per official
# docs, with the exact ArbOS/hardfork not published. "paris" predates PUSH0 (shanghai) and MCOPY / transient
# storage / blob opcodes (cancun); the frozen guarded-settlement contracts require none of those, so
# paris-compiled bytecode is guaranteed executable on every EVM >= paris including all Arbitrum Nitro
# versions. Used ONLY to produce the canary deploy artifact (build with `--skip '*.t.sol' '*.s.sol'` so the
# MCOPY-using OpenZeppelin utils pulled in by the deploy script/tests are excluded). The default profile
# stays on the solc-0.8.26 default so the full test suite still compiles. No contract-logic change.
[profile.canary]
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
